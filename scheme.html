<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贴词吧 · 方案详情</title>
    <meta property="og:title" content="贴词吧 · 方案详情">
    <meta property="og:description" content="AI 时代的提示词剪贴板 · 方案分享">
    <script src="supabase.min.js"></script>
    <style>
        :root {
            --bg: #f6f7f9;
            --surface: #ffffff;
            --text: #111827;
            --text-2: #6b7280;
            --text-3: #9ca3af;
            --border: #e5e7eb;
            --primary: #007aff;
            --primary-hover: #0062cc;
            --primary-ring: rgba(0, 122, 255, .12);
            --danger: #ff3b30;
            --warning: #ff9500;
            --success: #34c759;
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 8px;
            --radius-pill: 999px;
            --shadow-card: 0 1px 2px rgba(16,24,40,.05), 0 8px 24px rgba(16,24,40,.06);
            --shadow-float: 0 12px 40px rgba(16,24,40,.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        /* Slim scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: #b6bcc7; }

        /* Loading */
        .loading-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
        }
        .loader {
            width: 36px; height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Container */
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Top bar */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 4px 0 16px;
            margin-bottom: 4px;
        }
        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px; height: 36px;
            border-radius: 50%;
            background: var(--surface);
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 18px;
            box-shadow: 0 1px 2px rgba(16,24,40,.05);
            transition: all 0.18s ease;
            color: var(--text-2);
            text-decoration: none;
        }
        .back-btn:hover { background: #f3f4f6; color: var(--text); transform: translateY(-1px); }
        .back-btn:active { transform: translateY(0); }
        .brand-text {
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
        }

        /* Card base */
        .card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 28px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-card);
        }

        /* Author row */
        .author-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .author-avatar {
            width: 44px; height: 44px;
            border-radius: 50%;
            object-fit: cover;
            background: #eef4ff;
            border: 1px solid var(--border);
        }
        .author-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .author-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }
        .scheme-time {
            font-size: 13px;
            color: var(--text-3);
        }

        /* Title & Description */
        .scheme-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.35;
            letter-spacing: -0.01em;
            margin-bottom: 10px;
            word-break: break-word;
        }
        .scheme-desc {
            font-size: 15px;
            color: var(--text-2);
            line-height: 1.7;
            margin-bottom: 16px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Category Badge (colors set inline by JS) */
        .category-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            border-radius: var(--radius-pill);
            font-size: 13px;
            margin: 8px 0;
            font-weight: 500;
        }

        /* Image Carousel */
        .carousel-wrap {
            position: relative;
            margin-bottom: 20px;
            border-radius: 12px;
            overflow: hidden;
            background: #f3f4f6;
            border: 1px solid var(--border);
            aspect-ratio: 16/10;
            min-height: 200px;
        }
        .carousel-track {
            display: flex;
            height: 100%;
            transition: transform 0.35s cubic-bezier(0.25,0.8,0.25,1.2);
        }
        .carousel-slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #fafafa;
        }
        .carousel-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 36px; height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.92);
            border: 1px solid rgba(229,231,235,0.9);
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(16,24,40,0.10);
            transition: all 0.18s ease;
            z-index: 2;
            color: var(--text-2);
        }
        .carousel-arrow:hover { background: white; color: var(--text); box-shadow: 0 4px 12px rgba(16,24,40,0.16); }
        .carousel-arrow:disabled { opacity: 0.35; cursor: default; }
        .carousel-arrow.left { left: 10px; }
        .carousel-arrow.right { right: 10px; }
        .carousel-dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 2;
        }
        .carousel-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.55);
            border: none;
            cursor: pointer;
            transition: all 0.18s ease;
            padding: 0;
        }
        .carousel-dot.active {
            background: white;
            width: 22px;
            border-radius: var(--radius-pill);
            box-shadow: 0 1px 3px rgba(16,24,40,0.18);
        }

        /* Card chips */
        .cards-section {
            margin-bottom: 20px;
        }
        .cards-label {
            font-size: 13px;
            color: var(--text-3);
            margin-bottom: 10px;
            font-weight: 500;
        }
        .cards-text-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .text-card {
            background: #fafafa;
            border-radius: var(--radius-md);
            padding: 14px 16px;
            border: 1px solid #eef0f2;
            border-left: 3px solid var(--border);
            transition: border-color 0.18s ease, background 0.18s ease;
        }
        .text-card:hover { background: #f7f8fa; }
        .text-card-head {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .text-card-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .text-card-index {
            font-size: 13px;
            color: var(--text-3);
            flex-shrink: 0;
            min-width: 24px;
        }
        .text-card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            word-break: break-word;
        }
        .text-card-body {
            font-size: 13px;
            color: var(--text-2);
            line-height: 1.6;
            word-break: break-word;
            white-space: pre-wrap;
            margin-top: 6px;
            padding-left: 18px;
        }

        /* Action Bar */
        .action-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            padding-top: 8px;
            border-top: 1px solid #f3f4f6;
            margin-top: 4px;
        }
        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 8px 16px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border);
            background: var(--surface);
            cursor: pointer;
            font-size: 14px;
            color: var(--text-2);
            transition: all 0.18s ease;
            font-family: inherit;
            white-space: nowrap;
        }
        .action-btn:hover { background: #f6f7f9; color: var(--text); transform: translateY(-1px); }
        .action-btn:active { transform: translateY(0); }
        .action-btn.active { background: #fff0f0; border-color: #ffd6d4; color: var(--danger); }
        .action-btn.fav-active { background: #fff8e6; border-color: #ffe3ad; color: #e8890c; }
        .action-btn .icon { font-size: 16px; }
        .action-btn .count { font-size: 13px; font-weight: 500; }

        .action-btn.import-btn {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            font-weight: 600;
            margin-left: auto;
            box-shadow: 0 1px 2px rgba(0,122,255,.25);
        }
        .action-btn.import-btn:hover { background: var(--primary-hover); border-color: var(--primary-hover); transform: translateY(-1px); }
        .action-btn.import-btn:active { transform: translateY(0); }
        .action-btn.import-btn:disabled { background: var(--text-3); border-color: var(--text-3); cursor: wait; transform: none; }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(17,24,39,.92);
            color: white;
            padding: 10px 22px;
            border-radius: var(--radius-pill);
            font-size: 14px;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
            box-shadow: var(--shadow-float);
        }
        .toast.show { opacity: 1; }

        /* Comments */
        .comments-section { margin-top: 0; }
        .comments-header {
            font-size: 17px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .comments-header .count-badge {
            font-size: 13px;
            color: var(--text-3);
            font-weight: 400;
        }

        .comment-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: flex-end;
        }
        .comment-form .user-avatar-sm {
            width: 36px; height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background: #eef4ff;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }
        .comment-input-wrap {
            flex: 1;
            position: relative;
        }
        .comment-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
            line-height: 1.4;
            background: #fafafa;
            color: var(--text);
        }
        .comment-input::placeholder { color: var(--text-3); }
        .comment-input:focus {
            border-color: var(--primary);
            background: var(--surface);
            box-shadow: 0 0 0 3px var(--primary-ring);
        }
        .comment-submit {
            padding: 9px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-pill);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.18s ease;
            box-shadow: 0 1px 2px rgba(0,122,255,.25);
        }
        .comment-submit:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .comment-submit:active { transform: translateY(0); }
        .comment-submit:disabled { background: var(--text-3); cursor: wait; transform: none; box-shadow: none; }
        .login-hint {
            text-align: center;
            color: var(--text-3);
            font-size: 14px;
            padding: 16px 0;
        }
        .login-hint a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        .login-hint a:hover { color: var(--primary-hover); }

        .comment-list { display: flex; flex-direction: column; gap: 0; }
        .comment-item {
            padding: 16px 0;
            border-bottom: 1px solid #f3f4f6;
            display: flex;
            gap: 12px;
        }
        .comment-item:last-child { border-bottom: none; }
        .comment-avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background: #eef4ff;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }
        .comment-body { flex: 1; min-width: 0; }
        .comment-author {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }
        .comment-text {
            font-size: 14px;
            color: #374151;
            line-height: 1.6;
            word-break: break-word;
        }
        .comment-time {
            font-size: 12px;
            color: var(--text-3);
            margin-top: 6px;
        }
        .no-comments {
            text-align: center;
            color: var(--text-3);
            font-size: 14px;
            padding: 32px 0;
        }
        .comments-loading {
            text-align: center;
            padding: 20px;
        }

        /* Error state */
        .error-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-2);
        }
        .error-state .icon { font-size: 48px; margin-bottom: 16px; }
        .error-state .msg { font-size: 16px; margin-bottom: 20px; }
        .error-state .back-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        .error-state .back-link:hover { color: var(--primary-hover); }

        /* Footer */
        .footer {
            text-align: center;
            padding: 28px 24px;
            font-size: 12px;
            color: var(--text-3);
        }
        .footer a { color: var(--primary); text-decoration: none; }
        .footer a:hover { color: var(--primary-hover); }

        /* Responsive */

        /* Prevent horizontal overflow globally */
        html, body {
            overflow-x: hidden;
            max-width: 100vw;
        }

        /* Tablet / narrow desktop window (481-768px) */
        @media (max-width: 768px) {
            .container {
                max-width: 100%;
                padding: 16px;
            }
            .card {
                padding: 22px;
            }
            .scheme-title {
                font-size: 22px;
            }
            .carousel-wrap {
                aspect-ratio: 16/10;
                min-height: 180px;
            }
            .text-card { padding: 12px 14px; }
            .text-card-title { font-size: 13px; }
            .text-card-body { font-size: 12px; padding-left: 14px; }
            .toast {
                max-width: calc(100vw - 40px);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
        }

        /* Mobile / very narrow window (≤480px) */
        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }
            .card {
                padding: 16px;
                border-radius: 12px;
                margin-bottom: 12px;
            }
            .scheme-title {
                font-size: 20px;
                margin-bottom: 8px;
            }
            .scheme-desc {
                font-size: 14px;
                margin-bottom: 12px;
            }
            /* Top bar */
            .top-bar {
                gap: 8px;
                padding: 4px 0 10px;
                margin-bottom: 0;
            }
            .back-btn {
                width: 32px;
                height: 32px;
                font-size: 16px;
            }
            .brand-text {
                font-size: 14px;
            }
            /* Author */
            .author-row {
                gap: 10px;
                margin-bottom: 14px;
            }
            .author-avatar {
                width: 36px;
                height: 36px;
            }
            .author-name {
                font-size: 14px;
            }
            .scheme-time {
                font-size: 12px;
            }
            /* Carousel */
            .carousel-wrap {
                aspect-ratio: 4/3;
                min-height: 160px;
                margin-bottom: 14px;
            }
            .carousel-arrow {
                width: 30px;
                height: 30px;
                font-size: 16px;
            }
            .carousel-arrow.left {
                left: 4px;
            }
            .carousel-arrow.right {
                right: 4px;
            }
            .carousel-dots {
                bottom: 8px;
                gap: 5px;
            }
            .carousel-dot {
                width: 7px;
                height: 7px;
            }
            .carousel-dot.active {
                width: 20px;
                border-radius: 999px;
            }
            /* Card chips */
            .cards-section {
                margin-bottom: 16px;
            }
            .cards-text-list { gap: 10px; }
            .text-card { padding: 10px 12px; }
            .text-card-title { font-size: 13px; }
            .text-card-body { font-size: 12px; padding-left: 12px; }
            /* Action bar */
            .action-bar {
                gap: 5px;
            }
            .action-btn {
                padding: 7px 11px;
                font-size: 13px;
                gap: 4px;
            }
            .action-btn .icon {
                font-size: 14px;
            }
            .action-btn .count {
                font-size: 12px;
            }
            .action-btn.import-btn {
                margin-left: 0;
                width: 100%;
                justify-content: center;
                margin-top: 6px;
            }
            /* Comment form */
            .comments-header {
                font-size: 15px;
                margin-bottom: 12px;
            }
            .comment-form {
                flex-wrap: wrap;
                gap: 8px;
                margin-bottom: 16px;
            }
            .comment-form .user-avatar-sm {
                display: none;
            }
            .comment-input {
                max-width: 100%;
                padding: 9px 12px;
                font-size: 13px;
            }
            .comment-submit {
                width: 100%;
                padding: 10px 0;
                font-size: 14px;
            }
            /* Comment list */
            .comment-item {
                padding: 12px 0;
                gap: 10px;
            }
            .comment-avatar {
                width: 32px;
                height: 32px;
            }
            .comment-author {
                font-size: 13px;
            }
            .comment-text {
                font-size: 13px;
            }
            .comment-time {
                font-size: 11px;
            }
            /* Toast */
            .toast {
                max-width: calc(100vw - 32px);
                padding: 9px 18px;
                font-size: 13px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            /* Error state */
            .error-state {
                padding: 60px 16px;
            }
            .error-state .icon {
                font-size: 40px;
            }
            .error-state .msg {
                font-size: 15px;
            }
            /* Footer */
            .footer {
                padding: 16px 8px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

<!-- Loading -->
<div id="loading" class="loading-wrap"><div class="loader"></div></div>

<!-- Error State -->
<div id="errorState" style="display:none" class="error-state">
    <div class="icon">😕</div>
    <div class="msg" id="errorMsg">方案不存在或已被删除</div>
    <a href="/" class="back-link">← 返回贴词吧</a>
</div>

<!-- Main Content -->
<div id="main" style="display:none">
    <div class="container">
        <!-- Top Bar -->
        <div class="top-bar">
            <a href="/" class="back-btn" title="返回">←</a>
            <span class="brand-text">🧋 贴词吧</span>
        </div>

        <!-- Scheme Card -->
        <div class="card" id="schemeCard">
            <!-- Author Row -->
            <div class="author-row">
                <img class="author-avatar" id="authorAvatar" src="" alt="">
                <div class="author-info">
                    <span class="author-name" id="authorName">加载中…</span>
                    <span class="scheme-time" id="schemeTime"></span>
                </div>
            </div>

            <!-- Title -->
            <h1 class="scheme-title" id="schemeTitle"></h1>

            <!-- Category Badge -->
            <span class="category-badge" id="categoryBadge" style="display:none"></span>

            <!-- Description -->
            <div class="scheme-desc" id="schemeDesc"></div>

            <!-- Image Carousel -->
            <div class="carousel-wrap" id="carouselWrap" style="display:none">
                <div class="carousel-track" id="carouselTrack"></div>
                <button class="carousel-arrow left" id="carouselPrev" onclick="prevSlide()">‹</button>
                <button class="carousel-arrow right" id="carouselNext" onclick="nextSlide()">›</button>
                <div class="carousel-dots" id="carouselDots"></div>
            </div>

            <!-- Cards Preview -->
            <div class="cards-section" id="cardsSection" style="display:none">
                <div class="cards-label">📋 方案卡片 (<span id="cardsCount">0</span> 张)</div>
                <div class="cards-text-list" id="cardsTextList"></div>
            </div>

            <!-- Action Bar -->
            <div class="action-bar" id="actionBar">
                <button class="action-btn" id="likeBtn" onclick="toggleLike()" title="点赞">
                    <span class="icon">🤍</span><span class="count" id="likeCount">0</span>
                </button>
                <button class="action-btn" id="favBtn" onclick="toggleFavorite()" title="收藏">
                    <span class="icon">☆</span><span class="count" id="favCount">0</span>
                </button>
                <button class="action-btn" id="shareBtn" onclick="shareScheme()" title="分享">
                    <span class="icon">🔗</span> 分享
                </button>
                <button class="action-btn import-btn" id="importBtn" onclick="doImport()">
                    📥 导入到我的方案
                </button>
            </div>
        </div>

        <!-- Comments -->
        <div class="card comments-section" id="commentsSection">
            <div class="comments-header">
                💬 评论 <span class="count-badge" id="commentCountBadge"></span>
            </div>

            <!-- Comment Form (logged-in users only) -->
            <div id="commentFormWrap">
                <div class="comment-form" id="commentForm" style="display:none">
                    <img class="user-avatar-sm" id="myAvatar" src="" alt="">
                    <div class="comment-input-wrap">
                        <textarea class="comment-input" id="commentInput" rows="2" placeholder="写下你的评论…" maxlength="500"></textarea>
                    </div>
                    <button class="comment-submit" id="commentSubmitBtn" onclick="submitComment()">发布</button>
                </div>
                <div class="login-hint" id="loginHint" style="display:none">
                    请<a href="/">登录</a>后发表评论
                </div>
            </div>

            <!-- Comment List -->
            <div class="comment-list" id="commentList"></div>
            <div class="comments-loading" id="commentsLoading" style="display:none">
                <div class="loader" style="margin:0 auto"></div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <a href="/">贴词吧</a> · 让提示词流动起来
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ========== Supabase 配置 ========== */
const SUPABASE_URL = 'https://plnwkcdpzybbthuxfnmf.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_wWzHA_tkjquLLLa42OY6xQ_6JjzQzGt';
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ========== 分类定义 ========== */
const CATEGORIES = [
    { key: 'all',            label: '全部',           icon: '🏷️', color: '#007aff', bg: '#e8f4ff' },
    { key: '图生图提示词',   label: '🔄 图生图提示词', icon: '🔄', color: '#FF6B6B', bg: '#FFF0F0' },
    { key: '文生图提示词',   label: '📝 文生图提示词', icon: '📝', color: '#4ECDC4', bg: '#F0FFFE' },
    { key: '首尾帧提示词',   label: '🎬 首尾帧提示词', icon: '🎬', color: '#FFD93D', bg: '#FFFEF0' },
    { key: '洗图提示词',     label: '🧹 洗图提示词',   icon: '🧹', color: '#6C5CE7', bg: '#F5F0FF' },
    { key: '图片优化提示词', label: '✨ 图片优化提示词', icon: '✨', color: '#A8E6CF', bg: '#F0FFF5' },
    { key: 'AI任务提示词',   label: '🤖 AI任务提示词', icon: '🤖', color: '#FF8B94', bg: '#FFF5F5' },
    { key: '其他提示词',     label: '📌 其他提示词',   icon: '📌', color: '#B8B8B8', bg: '#F5F5F5' }
];
const CAT_MAP = {};
CATEGORIES.forEach(c => { CAT_MAP[c.key] = c; });

/* ========== 全局状态 ========== */
let currentScheme = null;
let currentUser = null;
let isLiked = false;
let isFavorited = false;
let currentSlide = 0;
let totalSlides = 0;
let toastTimer = null;

/* ========== DOM 引用 ========== */
const $ = (sel) => document.querySelector(sel);
const loadingEl = $('#loading');
const errorStateEl = $('#errorState');
const errorMsgEl = $('#errorMsg');
const mainEl = $('#main');

/* ========== 工具函数 ========== */
function escapeHtml(s) {
    if (!s) return '';
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

function formatTime(isoString) {
    if (!isoString) return '';
    const d = new Date(isoString);
    const now = new Date();
    const diff = now - d;
    const mins = Math.floor(diff / 60000);
    const hours = Math.floor(diff / 3600000);
    const days = Math.floor(diff / 86400000);
    if (mins < 1) return '刚刚';
    if (mins < 60) return `${mins} 分钟前`;
    if (hours < 24) return `${hours} 小时前`;
    if (days < 7) return `${days} 天前`;
    return d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
}

function formatDateTime(isoString) {
    if (!isoString) return '';
    const d = new Date(isoString);
    return d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function showToast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

/* ========== 图片轮播 ========== */
function updateCarousel() {
    const track = $('#carouselTrack');
    track.style.transform = `translateX(-${currentSlide * 100}%)`;

    // 更新箭头
    $('#carouselPrev').disabled = currentSlide === 0;
    $('#carouselNext').disabled = currentSlide >= totalSlides - 1;

    // 更新指示点
    document.querySelectorAll('.carousel-dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === currentSlide);
    });
}

function nextSlide() {
    if (currentSlide < totalSlides - 1) { currentSlide++; updateCarousel(); }
}
function prevSlide() {
    if (currentSlide > 0) { currentSlide--; updateCarousel(); }
}
function goToSlide(idx) {
    currentSlide = idx; updateCarousel();
}

function buildCarousel(images) {
    if (!images || images.length === 0) {
        $('#carouselWrap').style.display = 'none';
        return;
    }
    totalSlides = Math.min(images.length, 5);
    const wrap = $('#carouselWrap');
    wrap.style.display = 'block';

    const track = $('#carouselTrack');
    track.innerHTML = images.slice(0, 5).map(url =>
        `<div class="carousel-slide"><img src="${escapeHtml(url)}" alt="方案图片" loading="lazy"></div>`
    ).join('');

    const dots = $('#carouselDots');
    dots.innerHTML = images.slice(0, 5).map((_, i) =>
        `<button class="carousel-dot${i===0?' active':''}" onclick="goToSlide(${i})"></button>`
    ).join('');

    currentSlide = 0;
    updateCarousel();
}

/* ========== 卡片文字预览 ========== */
function buildCards(inputs) {
    const section = $('#cardsSection');
    const list = $('#cardsTextList');
    if (!inputs || inputs.length === 0) {
        section.style.display = 'none';
        return;
    }
    // 过滤掉空卡片（无标题且无内容）
    const filled = inputs.filter(c => (c.title || '').trim() || (c.content || '').trim());
    if (filled.length === 0) {
        section.style.display = 'none';
        return;
    }
    section.style.display = 'block';
    $('#cardsCount').textContent = filled.length;

    list.innerHTML = filled.map((c, i) => {
        const color = c.color || '#888';
        const title = (c.title || '').trim();
        const content = (c.content || '').trim();
        return `<div class="text-card">
            <div class="text-card-head">
                <span class="text-card-dot" style="background:${color}"></span>
                <span class="text-card-index">${i + 1}.</span>
                <span class="text-card-title">${escapeHtml(title || '（无标题）')}</span>
            </div>
            ${content ? `<div class="text-card-body">${escapeHtml(content)}</div>` : ''}
        </div>`;
    }).join('');
}

/* ========== 点赞/收藏 ========== */
async function checkInteractionStatus() {
    if (!currentUser || !currentScheme) return;
    const uid = currentUser.id;
    const sid = currentScheme.id;

    const [likeRes, favRes] = await Promise.all([
        supa.from('likes').select('id').eq('scheme_id', sid).eq('user_id', uid).maybeSingle(),
        supa.from('favorites').select('id').eq('scheme_id', sid).eq('user_id', uid).maybeSingle()
    ]);

    isLiked = !!likeRes.data;
    isFavorited = !!favRes.data;
    updateActionButtons();
}

function updateActionButtons() {
    const likeBtn = $('#likeBtn');
    const favBtn = $('#favBtn');

    if (isLiked) {
        likeBtn.classList.add('active');
        likeBtn.querySelector('.icon').textContent = '❤️';
    } else {
        likeBtn.classList.remove('active');
        likeBtn.querySelector('.icon').textContent = '🤍';
    }

    if (isFavorited) {
        favBtn.classList.add('fav-active');
        favBtn.querySelector('.icon').textContent = '⭐';
    } else {
        favBtn.classList.remove('fav-active');
        favBtn.querySelector('.icon').textContent = '☆';
    }

    $('#likeCount').textContent = currentScheme?.like_count || 0;
    $('#favCount').textContent = currentScheme?.favorite_count || 0;
}

async function toggleLike() {
    if (!currentUser) { showToast('请先登录'); return; }
    const sid = currentScheme.id;
    const uid = currentUser.id;

    if (isLiked) {
        // 取消点赞
        await supa.from('likes').delete().eq('scheme_id', sid).eq('user_id', uid);
        isLiked = false;
        currentScheme.like_count = Math.max(0, (currentScheme.like_count || 1) - 1);
    } else {
        // 点赞
        const { error } = await supa.from('likes').insert({ scheme_id: sid, user_id: uid });
        if (error && error.code === '23505') {
            // 已存在（可能并发），忽略
        }
        isLiked = true;
        currentScheme.like_count = (currentScheme.like_count || 0) + 1;
    }
    updateActionButtons();

    // 异步更新数据库计数
    supa.from('public_schemes').update({ like_count: currentScheme.like_count }).eq('id', sid).then(() => {});
}

async function toggleFavorite() {
    if (!currentUser) { showToast('请先登录'); return; }
    const sid = currentScheme.id;
    const uid = currentUser.id;

    if (isFavorited) {
        await supa.from('favorites').delete().eq('scheme_id', sid).eq('user_id', uid);
        isFavorited = false;
        currentScheme.favorite_count = Math.max(0, (currentScheme.favorite_count || 1) - 1);
    } else {
        const { error } = await supa.from('favorites').insert({ scheme_id: sid, user_id: uid });
        if (error && error.code === '23505') { /* ignore */ }
        isFavorited = true;
        currentScheme.favorite_count = (currentScheme.favorite_count || 0) + 1;
    }
    updateActionButtons();

    supa.from('public_schemes').update({ favorite_count: currentScheme.favorite_count }).eq('id', sid).then(() => {});
}

/* ========== 分享 ========== */
function shareScheme() {
    const url = window.location.href;
    if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(() => showToast('链接已复制到剪贴板！'));
    } else {
        // fallback
        const ta = document.createElement('textarea');
        ta.value = url;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('链接已复制到剪贴板！');
    }
    // 异步更新分享计数
    if (currentScheme) {
        const sid = currentScheme.id;
        supa.from('public_schemes').update({ share_count: (currentScheme.share_count || 0) + 1 }).eq('id', sid).then(() => {});
    }
}

/* ========== 导入 ========== */
async function doImport() {
    const btn = $('#importBtn');
    btn.disabled = true;
    btn.textContent = '导入中…';

    // 存到 localStorage，跳转到主页
    localStorage.setItem('pendingImport', JSON.stringify({
        source: currentScheme.id,
        title: currentScheme.title,
        cardCount: currentScheme.card_count,
        schemeData: currentScheme.scheme_data,
        importedAt: Date.now()
    }));

    window.location.href = '/';
}

/* ========== 评论 ========== */
async function loadComments() {
    const listEl = $('#commentList');
    const loadingEl = $('#commentsLoading');
    loadingEl.style.display = 'block';
    listEl.innerHTML = '';

    const sid = currentScheme.id;
    // 先拉评论
    const { data: commentsData, error } = await supa
        .from('comments')
        .select('id, content, created_at, user_id')
        .eq('scheme_id', sid)
        .order('created_at', { ascending: false })
        .limit(50);

    loadingEl.style.display = 'none';

    if (error || !commentsData || commentsData.length === 0) {
        listEl.innerHTML = '<div class="no-comments">暂无评论，来说点什么吧 💬</div>';
        $('#commentCountBadge').textContent = '(0)';
        return;
    }

    // 批量拉取用户信息
    const userIds = [...new Set(commentsData.map(c => c.user_id))];
    const { data: profilesData } = await supa
        .from('user_profiles')
        .select('id, display_name, avatar_url')
        .in('id', userIds);
    const profileMap = {};
    if (profilesData) {
        profilesData.forEach(p => { profileMap[p.id] = p; });
    }

    $('#commentCountBadge').textContent = `(${commentsData.length})`;

    listEl.innerHTML = commentsData.map(c => {
        const profile = profileMap[c.user_id];
        const name = profile?.display_name || '匿名用户';
        const avatar = profile?.avatar_url || '';
        return `
        <div class="comment-item">
            <img class="comment-avatar" src="${escapeHtml(avatar)}" alt="" onerror="this.style.display='none'">
            <div class="comment-body">
                <div class="comment-author">${escapeHtml(name)}</div>
                <div class="comment-text">${escapeHtml(c.content)}</div>
                <div class="comment-time">${formatTime(c.created_at)}</div>
            </div>
        </div>`;
    }).join('');
}

async function submitComment() {
    if (!currentUser) { showToast('请先登录'); return; }

    const input = $('#commentInput');
    const content = input.value.trim();
    if (!content) { showToast('请输入评论内容'); return; }

    const btn = $('#commentSubmitBtn');
    btn.disabled = true;
    btn.textContent = '发布中…';

    const { error } = await supa.from('comments').insert({
        scheme_id: currentScheme.id,
        user_id: currentUser.id,
        content: content
    });

    if (error) {
        showToast('评论失败，请重试');
        btn.disabled = false;
        btn.textContent = '发布';
        return;
    }

    // 更新计数
    const newCount = (currentScheme.comment_count || 0) + 1;
    currentScheme.comment_count = newCount;
    supa.from('public_schemes').update({ comment_count: newCount }).eq('id', currentScheme.id).then(() => {});

    input.value = '';
    btn.disabled = false;
    btn.textContent = '发布';
    showToast('评论发布成功！');
    await loadComments();
}

/* ========== 初始化 ========== */
async function init() {
    // 获取 session
    const { data: sessionData } = await supa.auth.getSession();
    currentUser = sessionData?.session?.user || null;

    // 获取 scheme id
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if (!id) {
        showError('未提供方案 ID');
        return;
    }

    // 拉取方案数据
    const { data, error } = await supa
        .from('public_schemes')
        .select('*')
        .eq('id', id)
        .maybeSingle();

    if (error || !data) {
        showError('方案不存在或已被删除');
        return;
    }

    currentScheme = data;

    // 增加浏览次数（异步，不阻塞渲染）
    supa.from('public_schemes')
        .update({ view_count: (data.view_count || 0) + 1 })
        .eq('id', id)
        .then(() => {});
    currentScheme.view_count = (data.view_count || 0) + 1;

    // 隐藏 loading，显示 main
    loadingEl.style.display = 'none';
    mainEl.style.display = 'block';

    // 更新 OG 标签
    document.title = `贴词吧 · ${data.title}`;
    try {
        document.querySelector('meta[property="og:title"]').setAttribute('content', `贴词吧 · ${data.title}`);
        document.querySelector('meta[property="og:description"]').setAttribute('content', `${data.card_count} 张卡片 · ${data.description?.slice(0, 80) || '方案分享'}`);
    } catch(e) {}

    // 渲染内容
    renderScheme(data);

    // 获取作者信息
    if (data.owner_id) {
        loadAuthorInfo(data.owner_id);
    }

    // 加载图片轮播
    if (data.images && data.images.length > 0) {
        buildCarousel(data.images);
    }

    // 加载卡片预览
    const schemeData = data.scheme_data;
    let inputs = [];
    if (schemeData && typeof schemeData === 'object') {
        inputs = Array.isArray(schemeData) ? schemeData : (schemeData.inputs || []);
    }
    if (inputs.length > 0) {
        buildCards(inputs);
    }

    // 初始操作按钮状态
    updateActionButtons();

    // 评论区域
    if (currentUser) {
        $('#commentForm').style.display = 'flex';
        $('#loginHint').style.display = 'none';
        // 设置当前用户头像
        const avatar = currentUser.user_metadata?.avatar_url || currentUser.user_metadata?.picture || '';
        $('#myAvatar').src = avatar;
    } else {
        $('#commentForm').style.display = 'none';
        $('#loginHint').style.display = 'block';
    }

    // 加载评论
    loadComments();

    // 检查点赞/收藏状态
    if (currentUser) {
        checkInteractionStatus();
    }
}

function renderScheme(data) {
    $('#schemeTitle').textContent = data.title || '未命名方案';
    $('#schemeDesc').textContent = data.description || '';

    // 分类 badge
    const badge = $('#categoryBadge');
    if (data.category && CAT_MAP[data.category]) {
        const cat = CAT_MAP[data.category];
        badge.style.display = 'inline-flex';
        badge.style.background = cat.bg;
        badge.style.color = cat.color;
        badge.style.border = '1px solid ' + cat.color + '33';
        badge.textContent = cat.label;
    } else {
        badge.style.display = 'none';
    }

    // 时间
    if (data.created_at) {
        $('#schemeTime').textContent = formatDateTime(data.created_at);
    }

    // 作者默认展示
    $('#authorName').textContent = '加载中…';
    $('#authorAvatar').src = '';
}

async function loadAuthorInfo(ownerId) {
    const { data } = await supa
        .from('user_profiles')
        .select('display_name, avatar_url')
        .eq('id', ownerId)
        .maybeSingle();

    if (data) {
        $('#authorName').textContent = data.display_name || '匿名用户';
        if (data.avatar_url) {
            $('#authorAvatar').src = data.avatar_url;
        }
    } else {
        $('#authorName').textContent = '匿名用户';
    }
}

function showError(msg) {
    loadingEl.style.display = 'none';
    errorStateEl.style.display = 'block';
    errorMsgEl.textContent = msg;
}

/* ========== 键盘导航 ========== */
document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') prevSlide();
    if (e.key === 'ArrowRight') nextSlide();
});

init();
</script>
</body>
</html>
